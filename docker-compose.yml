services:
  agent-node:
    build: .
    image: csce465-hw4:local
    command: ["sleep", "infinity"]
    volumes:
      - ./mock_skill.sh:/app/mock_skill.sh
      - ./fake_secrets.txt:/app/fake_secrets.txt:ro
    networks:
      hw4net:
        ipv4_address: 172.30.0.10

  web-lab:
    image: csce465-hw4:local
    command: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0", "--directory", "/app/web"]
    volumes:
      - ./web:/app/web:ro
    networks:
      hw4net:
        ipv4_address: 172.30.0.40

  mock-c2:
    image: csce465-hw4:local
    command: ["python", "/app/c2.py"]
    volumes:
      - ./c2.py:/app/c2.py:ro
    networks:
      hw4net:
        ipv4_address: 172.30.0.66

networks:
  hw4net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-hw4
    ipam:
      config:
        - subnet: 172.30.0.0/24

